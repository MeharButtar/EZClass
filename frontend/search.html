<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search · EzClass</title>
<meta name="description" content="Search every class this term by subject, day, professor or keyword.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/base.css">
<script type="module" src="js/pages/search.js"></script>
<script type="module" src="js/track.js"></script>
</head>
<body data-page="search">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main" class="page">
    <div class="workspace">
      <div class="workspace-main">
        <div class="page-head">
          <div>
            <h1>Search</h1>
            <p id="search-sub">Every class this term, by subject, day, professor or keyword.</p>
          </div>
        </div>

        <form class="filters" id="search-form" role="search">
          <label class="field">Subject
            <select class="select" id="f-subject"><option value="">All subjects</option></select>
          </label>
          <label class="field">Day
            <select class="select" id="f-day">
              <option value="">Any day</option>
              <option value="M">Monday</option>
              <option value="T">Tuesday</option>
              <option value="W">Wednesday</option>
              <option value="Th">Thursday</option>
              <option value="F">Friday</option>
            </select>
          </label>
          <label class="field">Professor
            <input class="input" type="text" id="f-professor" placeholder="e.g. Nguyen" autocomplete="off">
          </label>
          <label class="field">Keyword
            <input class="input" type="text" id="f-keyword" placeholder="course or title, e.g. CS 480 or data science" autocomplete="off">
          </label>
          <div class="actions">
            <button type="submit" class="btn btn-primary">Search</button>
            <button type="reset" class="btn">Reset</button>
          </div>
        </form>

        <div class="results-bar">
          <p class="muted small" id="search-count" aria-live="polite"></p>
        </div>
        <div id="search-root"></div>
      </div>
      <aside class="dock" id="dock"></aside>
    </div>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
